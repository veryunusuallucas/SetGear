<!DOCTYPE html>
<html lang="pt-BR" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <!-- viewport-fit=cover: o app roda instalado, em tela cheia, e precisa
         desenhar sob o notch. `user-scalable=no` fica de fora de propósito:
         impedir o zoom quebra a acessibilidade, e num set escuro alguém vai
         querer aproximar para ler uma etiqueta. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#121212" />
    <title>SetGear — Controle de Equipamento de Set</title>
    <meta name="description" content="Controle de equipamento de cinema: o que sai da base, o que chega no set e o que volta. Conferência por QR Code, malas container e trava de wrap." />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  </head>
  <body class="bg-[#121212] text-slate-100 font-sans antialiased overflow-x-hidden">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
